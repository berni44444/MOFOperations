[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mof-operations"
version = "0.1.0"
description = "Python utilities for MOF structure operations"
requires-python = ">=3.10"

dependencies = [
    "matplotlib",
    "numpy",
    "PyYAML",
    "ase",
    "packaging",
    "pandas",
]

[tool.setuptools]
py-modules = ["MOFOperations"]
